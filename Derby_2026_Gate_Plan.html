<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
<title>SDF Derby 2026 — Gate Plan</title>
<style>
  /* === Type & Theme === */
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
  
  :root {
    --bg: #0a0e14;
    --bg-elevated: #11161f;
    --bg-row: #0d1219;
    --bg-row-alt: #0f1520;
    --border: #1c2433;
    --border-strong: #2a3447;
    --text: #e6edf3;
    --text-dim: #7d8590;
    --text-muted: #5a6373;
    --accent: #ffb000;     /* amber - operational */
    --accent-soft: rgba(255, 176, 0, 0.12);
    --now: #ff5252;
    --good: #3fb950;
    --warn: #f0883e;
    --danger: #f85149;
    
    /* Airline colors - using brand-recognizable hues but tuned for dark UI */
    --c-delta: #c8102e;        /* DAL widow red */
    --c-delta-soft: rgba(200, 16, 46, 0.18);
    --c-united: #1d4f91;       /* UAL blue */
    --c-united-soft: rgba(29, 79, 145, 0.25);
    --c-american: #0078d2;     /* AAL blue */
    --c-american-soft: rgba(0, 120, 210, 0.22);
    --c-southwest: #f9b612;    /* WN yellow (different concourse than UAL) */
    --c-southwest-soft: rgba(249, 182, 18, 0.18);
    --c-spirit: #ffeb00;       /* NK yellow */
    --c-spirit-soft: rgba(255, 235, 0, 0.16);
    --c-allegiant: #ff7900;    /* G4 orange */
    --c-allegiant-soft: rgba(255, 121, 0, 0.18);
    --c-suncountry: #d61f2c;   /* SY red */
    --c-suncountry-soft: rgba(214, 31, 44, 0.18);
    --c-breeze: #4dbeff;       /* MX cyan */
    --c-breeze-soft: rgba(77, 190, 255, 0.18);
    --c-reserved: #5a6373;
    --c-reserved-soft: rgba(90, 99, 115, 0.14);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.4;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  
  /* === Top Bar === */
  .topbar {
    background: linear-gradient(180deg, #11161f 0%, #0a0e14 100%);
    border-bottom: 1px solid var(--border-strong);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 24px;
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(8px);
  }
  
  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  
  .brand-mark {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.02em;
    color: var(--accent);
  }
  
  .brand-mark::before {
    content: "▣";
    margin-right: 6px;
    color: var(--accent);
  }
  
  .brand-sub {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--text-dim);
    font-weight: 600;
  }
  
  .topbar-meta {
    margin-left: auto;
    display: flex;
    gap: 20px;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }
  
  .topbar-meta .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  
  .topbar-meta .stat-label {
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  
  .topbar-meta .stat-val {
    color: var(--text);
    font-weight: 600;
    font-size: 13px;
  }
  
  .topbar-meta .stat-val.live {
    color: var(--accent);
  }
  
  /* === Controls Bar === */
  .controls {
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    position: sticky;
    top: 51px;
    z-index: 40;
  }
  
  .control-group {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  
  .control-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    margin-right: 4px;
    font-weight: 600;
  }
  
  .btn {
    background: var(--bg-row);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 6px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.12s ease;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  .btn:hover {
    background: var(--border);
    color: var(--text);
    border-color: var(--border-strong);
  }
  
  .btn.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
  }
  
  .btn.danger {
    color: var(--danger);
  }
  
  .btn.danger.active {
    background: rgba(248, 81, 73, 0.15);
    border-color: var(--danger);
  }
  
  .search-input {
    background: var(--bg-row);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    width: 200px;
    border-radius: 3px;
  }
  
  .search-input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--bg);
  }
  
  .search-input::placeholder {
    color: var(--text-muted);
  }
  
  /* === Concourse Selector === */
  .concourse-tabs {
    display: flex;
    gap: 0;
    background: var(--bg-elevated);
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
  }
  
  .tab {
    padding: 12px 24px;
    background: transparent;
    color: var(--text-dim);
    border: none;
    border-bottom: 2px solid transparent;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: all 0.15s ease;
  }
  
  .tab:hover {
    color: var(--text);
  }
  
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  
  .tab .count {
    margin-left: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
  }
  
  /* === Gantt Container === */
  .gantt-wrap {
    overflow-x: auto;
    overflow-y: visible;
    background: var(--bg);
    position: relative;
  }
  
  .gantt {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-width: max-content;
  }
  
  /* Gate column (left, sticky) */
  .gate-col {
    position: sticky;
    left: 0;
    background: var(--bg-elevated);
    border-right: 1px solid var(--border-strong);
    z-index: 10;
  }
  
  .gate-header-cell {
    height: 56px;
    border-bottom: 2px solid var(--border-strong);
    background: var(--bg-elevated);
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    font-weight: 700;
    position: sticky;
    top: 0;
    z-index: 11;
  }
  
  .gate-cell {
    height: 60px;
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-elevated);
  }
  
  .gate-cell.dimmed { opacity: 0.4; }
  
  .gate-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    min-width: 44px;
  }
  
  .gate-airlines {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    flex: 1;
  }
  
  .airline-chip {
    padding: 2px 6px;
    border-radius: 2px;
    font-size: 9px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  
  .gate-stats {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    text-align: right;
    line-height: 1.2;
  }
  
  .gate-stats .num { color: var(--text-dim); font-weight: 600; }
  
  /* === Timeline (right) === */
  .timeline-col { position: relative; }
  
  .time-header {
    height: 56px;
    background: var(--bg-elevated);
    border-bottom: 2px solid var(--border-strong);
    position: sticky;
    top: 0;
    z-index: 9;
    overflow: hidden;
  }
  
  .time-tick {
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: 1px solid var(--border);
    padding: 8px 0 0 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    user-select: none;
  }
  
  .time-tick.major {
    border-left-color: var(--border-strong);
    color: var(--text-dim);
  }
  
  .time-tick.major .label { 
    font-weight: 700; 
    font-size: 11px; 
    color: var(--text);
  }
  
  .time-tick .sublabel {
    display: block;
    font-size: 9px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  
  .timeline-rows {
    position: relative;
  }
  
  .gate-row {
    height: 60px;
    border-bottom: 1px solid var(--border);
    position: relative;
    background: var(--bg-row);
  }
  
  .gate-row:nth-child(even) { background: var(--bg-row-alt); }
  
  .gate-row.dimmed { opacity: 0.35; }
  
  /* Hour grid lines */
  .grid-line {
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: 1px solid var(--border);
    pointer-events: none;
  }
  
  .grid-line.major { border-left-color: var(--border-strong); }
  
  /* Now indicator */
  .now-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--now);
    z-index: 5;
    box-shadow: 0 0 8px rgba(255, 82, 82, 0.6);
    pointer-events: none;
  }
  
  .now-line::before {
    content: "";
    position: absolute;
    top: -4px;
    left: -4px;
    width: 10px;
    height: 10px;
    background: var(--now);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--now);
  }
  
  .now-label {
    position: absolute;
    top: -22px;
    left: 6px;
    background: var(--now);
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: 2px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  
  /* === Flight Bars === */
  .flight-bar {
    position: absolute;
    top: 6px;
    bottom: 6px;
    border-radius: 3px;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: stretch;
    border-left: 3px solid;
    transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.15s ease;
    min-width: 18px;
  }
  
  .flight-bar:hover {
    transform: scale(1.02);
    z-index: 4;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    border-left-width: 4px;
  }
  
  .flight-bar.dimmed { opacity: 0.18; }
  .flight-bar.highlighted { box-shadow: 0 0 0 2px var(--accent), 0 0 16px rgba(255,176,0,0.4); z-index: 6; }
  
  .flight-bar.delta { background: var(--c-delta-soft); border-left-color: var(--c-delta); color: #ffd6dc; }
  .flight-bar.united { background: var(--c-united-soft); border-left-color: var(--c-united); color: #c8d8f0; }
  .flight-bar.american { background: var(--c-american-soft); border-left-color: var(--c-american); color: #c0e2ff; }
  .flight-bar.southwest { background: var(--c-southwest-soft); border-left-color: var(--c-southwest); color: #ffe9a8; }
  .flight-bar.spirit { background: var(--c-spirit-soft); border-left-color: var(--c-spirit); color: #fff8b8; }
  .flight-bar.allegiant { background: var(--c-allegiant-soft); border-left-color: var(--c-allegiant); color: #ffd4b3; }
  .flight-bar.suncountry { background: var(--c-suncountry-soft); border-left-color: var(--c-suncountry); color: #ffc8cd; }
  .flight-bar.breeze { background: var(--c-breeze-soft); border-left-color: var(--c-breeze); color: #c8e8ff; }
  
  .flight-bar.ron::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 6px,
      rgba(255,255,255,0.04) 6px,
      rgba(255,255,255,0.04) 12px
    );
    pointer-events: none;
  }
  
  .bar-content {
    padding: 4px 8px;
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 1.2;
    font-family: 'JetBrains Mono', monospace;
  }
  
  .bar-line1 {
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  
  .bar-line2 {
    font-size: 9px;
    opacity: 0.85;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }
  
  .bar-tag {
    font-size: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    background: rgba(0,0,0,0.4);
    padding: 1px 4px;
    border-radius: 2px;
    align-self: flex-start;
  }
  
  /* === Tooltip === */
  .tooltip {
    position: fixed;
    background: var(--bg-elevated);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 0;
    box-shadow: 0 12px 32px rgba(0,0,0,0.7);
    z-index: 100;
    min-width: 280px;
    max-width: 340px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s ease;
    font-size: 12px;
  }
  
  .tooltip.visible { opacity: 1; }
  
  .tooltip-head {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .tooltip-airline {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
  }
  
  .tooltip-gate {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
  }
  
  .tooltip-route {
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--bg-row);
  }
  
  .tooltip-airport {
    text-align: center;
    flex: 1;
  }
  
  .tooltip-airport .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
  }
  
  .tooltip-airport .label {
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-top: 4px;
  }
  
  .tooltip-airport .time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  
  .tooltip-arrow {
    color: var(--text-muted);
    font-size: 18px;
  }
  
  .tooltip-details {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
  }
  
  .tooltip-detail {
    display: flex;
    flex-direction: column;
  }
  
  .tooltip-detail .k {
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  
  .tooltip-detail .v {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    margin-top: 2px;
  }
  
  .tooltip-detail .v.muted { color: var(--text-dim); font-weight: 500; }
  
  /* === Modal Detail Panel === */
  .panel-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(2px);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  
  .panel-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }
  
  .panel {
    position: fixed;
    right: 0;
    top: 0;
    bottom: 0;
    width: 480px;
    max-width: 100vw;
    background: var(--bg-elevated);
    border-left: 1px solid var(--border-strong);
    z-index: 201;
    transform: translateX(100%);
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  
  .panel.visible { transform: translateX(0); }
  
  .panel-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .panel-head h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    font-weight: 600;
  }
  
  .panel-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 3px;
    line-height: 1;
  }
  
  .panel-close:hover { background: var(--border); color: var(--text); }
  
  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  
  .panel-airline-banner {
    padding: 14px 16px;
    border-radius: 4px;
    margin-bottom: 20px;
    border-left: 4px solid;
    font-family: 'Space Grotesk', sans-serif;
  }
  
  .panel-airline-banner .name {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }
  
  .panel-airline-banner .iata {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    margin-top: 2px;
    opacity: 0.85;
  }
  
  .panel-route-viz {
    background: var(--bg-row);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 20px;
  }
  
  .panel-route-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  
  .panel-route-stop {
    text-align: center;
  }
  
  .panel-route-stop .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  
  .panel-route-stop .label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-top: 6px;
  }
  
  .panel-route-stop .time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--accent);
    font-weight: 600;
    margin-top: 6px;
  }
  
  .panel-route-conn {
    flex: 1;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text-muted);
  }
  
  .panel-route-conn .line {
    width: 100%;
    height: 1px;
    background: var(--border-strong);
    position: relative;
  }
  
  .panel-route-conn .line::after {
    content: "▶";
    position: absolute;
    right: -2px;
    top: -7px;
    color: var(--text-dim);
    font-size: 12px;
  }
  
  .panel-route-conn .turn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    margin-top: 8px;
    font-weight: 600;
    background: var(--accent-soft);
    padding: 3px 10px;
    border-radius: 99px;
  }
  
  .panel-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  
  .panel-stat {
    background: var(--bg-row);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px;
  }
  
  .panel-stat .k {
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 4px;
  }
  
  .panel-stat .v {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }
  
  .panel-section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    margin-bottom: 10px;
    font-weight: 700;
  }
  
  /* === Legend === */
  .legend {
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    font-size: 11px;
    position: sticky;
    bottom: 0;
    z-index: 30;
  }
  
  .legend-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    font-weight: 700;
    margin-right: 4px;
  }
  
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.1s;
  }
  
  .legend-item:hover { opacity: 0.7; }
  
  .legend-item.disabled { opacity: 0.3; }
  
  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 2px;
    border-left: 3px solid;
  }
  
  .legend-swatch.delta { background: var(--c-delta-soft); border-left-color: var(--c-delta); }
  .legend-swatch.united { background: var(--c-united-soft); border-left-color: var(--c-united); }
  .legend-swatch.american { background: var(--c-american-soft); border-left-color: var(--c-american); }
  .legend-swatch.southwest { background: var(--c-southwest-soft); border-left-color: var(--c-southwest); }
  .legend-swatch.spirit { background: var(--c-spirit-soft); border-left-color: var(--c-spirit); }
  .legend-swatch.allegiant { background: var(--c-allegiant-soft); border-left-color: var(--c-allegiant); }
  .legend-swatch.breeze { background: var(--c-breeze-soft); border-left-color: var(--c-breeze); }
  .legend-swatch.ron {
    background: var(--c-reserved-soft);
    background-image: repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(255,255,255,0.08) 3px, rgba(255,255,255,0.08) 6px);
    border-left-color: var(--text-dim);
  }
  
  .legend-name {
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
  }
  
  .legend-count {
    color: var(--text-muted);
    font-size: 9px;
    font-family: 'JetBrains Mono', monospace;
  }
  
  /* === Empty state === */
  .empty {
    padding: 40px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }
  
  /* Scrollbar */
  ::-webkit-scrollbar { height: 12px; width: 12px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  
  /* Print */
  @media print {
    .topbar, .controls, .concourse-tabs, .legend { display: none; }
    .gantt-wrap { overflow: visible; }
    body { background: white; color: black; }
  }
  
  /* Responsive: smaller screens */
  @media (max-width: 900px) {
    .gantt { grid-template-columns: 180px 1fr; }
    .gate-num { font-size: 16px; min-width: 36px; }
    .topbar-meta .stat-label { display: none; }
    .panel { width: 100vw; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand">
    <div class="brand-mark">SDF/KSDF</div>
    <div class="brand-sub">Derby 2026 · Gate Plan</div>
  </div>
  <div class="topbar-meta">
    <div class="stat">
      <div class="stat-label">Now</div>
      <div class="stat-val live" id="now-display">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Active</div>
      <div class="stat-val" id="active-count">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Total Movements</div>
      <div class="stat-val" id="total-count">—</div>
    </div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="control-group">
    <span class="control-label">Time</span>
    <button class="btn" id="jump-now">Now</button>
    <button class="btn" id="jump-am">AM Peak</button>
    <button class="btn" id="jump-pm">PM Peak</button>
    <button class="btn" id="jump-eve">Evening</button>
  </div>
  <div class="control-group">
    <span class="control-label">Zoom</span>
    <button class="btn" data-zoom="0.6">60%</button>
    <button class="btn active" data-zoom="1">100%</button>
    <button class="btn" data-zoom="1.5">150%</button>
    <button class="btn" data-zoom="2.5">250%</button>
  </div>
  <div class="control-group">
    <span class="control-label">Show</span>
    <button class="btn active" id="show-all">All</button>
    <button class="btn" id="show-active">Active Now</button>
    <button class="btn" id="show-ron">RON Only</button>
    <button class="btn" id="show-turns">Turns Only</button>
  </div>
  <div class="control-group" style="margin-left:auto;">
    <input type="text" class="search-input" id="search" placeholder="Search flight, dest, gate…">
  </div>
</div>

<!-- CONCOURSE TABS -->
<div class="concourse-tabs">
  <button class="tab active" data-concourse="a">Concourse A <span class="count" id="count-a"></span></button>
  <button class="tab" data-concourse="b">Concourse B <span class="count" id="count-b"></span></button>
  <button class="tab" data-concourse="all">Both <span class="count" id="count-all"></span></button>
</div>

<!-- GANTT -->
<div class="gantt-wrap" id="gantt-wrap">
  <div class="gantt" id="gantt"></div>
</div>

<!-- LEGEND -->
<div class="legend" id="legend">
  <span class="legend-label">Filter Airlines</span>
</div>

<!-- TOOLTIP -->
<div class="tooltip" id="tooltip"></div>

<!-- DETAIL PANEL -->
<div class="panel-overlay" id="panel-overlay"></div>
<aside class="panel" id="panel">
  <div class="panel-head">
    <h2>Flight Detail</h2>
    <button class="panel-close" id="panel-close">×</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</aside>

// Constants
const CHART_START_MIN = 0;       // 04:30 EDT
const CHART_END_MIN = 1265;      // 01:35 EDT next day (approx)

// State

// ============================================================
// Time Utilities
// ============================================================

function minToHHMM(mins) {
  // mins from 0430 EDT
  let total = 4 * 60 + 30 + mins;
  while (total < 0) total += 24 * 60;
  const h = Math.floor(total / 60) % 24;
  const m = ((total % 60) + 60) % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}

function minToDisplayTime(mins) {
  return minToHHMM(mins);
}

function getNowMin() {
  // Convert current real clock to chart minutes (treating as if it's Derby Saturday)
  // For demo purposes, use a deterministic "demo time" so the layout is interesting
  // But also support real clock if we're between 04:30 and 02:00 next day.
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const baseH = 4, baseM = 30;
  let curMin = h * 60 + m - (baseH * 60 + baseM);
  if (curMin < -60 || curMin > CHART_END_MIN + 60) {
    // Outside ops hours - return mid-day demo time
    return 540; // 13:30
  }
  return curMin;
}

// ============================================================
// Data prep
// ============================================================

function getFlights() {
  const c = state.concourse;
  let flights = [];
  if (c === 'a' || c === 'all') flights = flights.concat(FLIGHT_DATA.concourse_a.map(f => ({ ...f, _concourse: 'a' })));
  if (c === 'b' || c === 'all') flights = flights.concat(FLIGHT_DATA.concourse_b.map(f => ({ ...f, _concourse: 'b' })));
  return flights;
}

// Concourse A gate ordering matches the original Excel (clockwise from A1)
const CONCOURSE_A_ORDER = ['A1', 'A3', 'A5', 'A9', 'A11', 'A15', 'A14', 'A12', 'A10', 'A8', 'A6', 'A4'];
const CONCOURSE_B_ORDER = ['B2', 'B4', 'B6', 'B16A', 'B16', 'B18', 'B18A', 'B19', 'B17', 'B15', 'B11', 'B9', 'B5'];

function getGateOrder() {
  if (state.concourse === 'a') return CONCOURSE_A_ORDER;
  if (state.concourse === 'b') return CONCOURSE_B_ORDER;
  return [...CONCOURSE_A_ORDER, ...CONCOURSE_B_ORDER];
}

// Group flights by gate
function groupByGate(flights) {
  const map = new Map();
  for (const f of flights) {
    if (!map.has(f.gate)) map.set(f.gate, []);
    map.get(f.gate).push(f);
  }
  return map;
}

function getGateStats(gateFlights) {
  const airlines = new Set();
  let total = 0, ron = 0;
  for (const f of gateFlights) {
    airlines.add(f.airline);
    total++;
    if (f.type !== 'turn') ron++;
  }
  return { airlines: [...airlines], total, ron };
}

// ============================================================
// Render
// ============================================================

function pxPerMin() { return state.pxPerMin * state.zoom; }

function timelineWidth() { return CHART_TOTAL_MIN * pxPerMin(); }

function render() {
  const flights = getFlights();
  const gateOrder = getGateOrder();
  const flightsByGate = groupByGate(flights);
  
  // Clear  
  const root = document.getElementById('gantt');
  root.innerHTML = '';
  root.style.gridTemplateColumns = `240px ${timelineWidth()}px`;
  
  // === Left: Gate Column ===
  const gateColEl = document.createElement('div');
  gateColEl.className = 'gate-col';
  
  const gateHeader = document.createElement('div');
  gateHeader.className = 'gate-header-cell';
  gateHeader.textContent = 'Gate / Airlines';
  gateColEl.appendChild(gateHeader);
  
  for (let i = 0; i < gateOrder.length; i++) {
    const gate = gateOrder[i];
    const cell = document.createElement('div');
    cell.className = 'gate-cell';
    if (state.concourse === 'all' && gate.startsWith('B') && i > 0 && gateOrder[i-1].startsWith('A')) {
      cell.style.borderTop = '2px solid var(--accent-soft)';
    }
    cell.dataset.gate = gate;
    
    const stats = getGateStats(flightsByGate.get(gate) || []);
    
    cell.innerHTML = `
      <div class="gate-num">${gate}</div>
      <div class="gate-airlines">
        ${stats.airlines.map(a => {
          const m = AIRLINES[a];
          if (!m) return '';
          return `<span class="airline-chip" style="background:${m.hex}">${m.iata}</span>`;
        }).join('')}
      </div>
      <div class="gate-stats">
        <div><span class="num">${stats.total}</span> ops</div>
        <div><span class="num">${stats.ron}</span> RON</div>
      </div>
    `;
    gateColEl.appendChild(cell);
  }
  root.appendChild(gateColEl);
  
  // === Right: Timeline ===
  const tlCol = document.createElement('div');
  tlCol.className = 'timeline-col';
  
  // Time header
  const timeHeader = document.createElement('div');
  timeHeader.className = 'time-header';
  
  // Add hour ticks every 60 min (and every 30 min when zoomed in)
  const minorInterval = state.zoom >= 1.5 ? 30 : 60;
  for (let m = 0; m <= CHART_TOTAL_MIN; m += minorInterval) {
    const tick = document.createElement('div');
    const isMajor = m % 60 === 0;
    tick.className = 'time-tick' + (isMajor ? ' major' : '');
    tick.style.left = (m * pxPerMin()) + 'px';
    if (isMajor) {
      tick.innerHTML = `<span class="label">${minToHHMM(m)}</span>`;
    } else {
      tick.innerHTML = `<span class="sublabel">${minToHHMM(m)}</span>`;
    }
    timeHeader.appendChild(tick);
  }
  tlCol.appendChild(timeHeader);
  
  // Rows
  const rowsEl = document.createElement('div');
  rowsEl.className = 'timeline-rows';
  rowsEl.style.position = 'relative';
  
  // Hour grid lines (across entire row area)
  for (let m = 0; m <= CHART_TOTAL_MIN; m += 60) {
    const line = document.createElement('div');
    line.className = 'grid-line major';
    line.style.left = (m * pxPerMin()) + 'px';
    line.style.height = (gateOrder.length * ROW_H) + 'px';
    rowsEl.appendChild(line);
  }
  if (state.zoom >= 1.5) {
    for (let m = 30; m <= CHART_TOTAL_MIN; m += 60) {
      const line = document.createElement('div');
      line.className = 'grid-line';
      line.style.left = (m * pxPerMin()) + 'px';
      line.style.height = (gateOrder.length * ROW_H) + 'px';
      rowsEl.appendChild(line);
    }
  }
  
  // Now line
  const nowMin = getNowMin();
  if (nowMin >= 0 && nowMin <= CHART_TOTAL_MIN) {
    const nowEl = document.createElement('div');
    nowEl.className = 'now-line';
    nowEl.style.left = (nowMin * pxPerMin()) + 'px';
    nowEl.style.height = (gateOrder.length * ROW_H) + 'px';
    nowEl.innerHTML = `<div class="now-label">NOW · ${minToHHMM(nowMin)}</div>`;
    rowsEl.appendChild(nowEl);
  }
  
  // Gate rows + flight bars
  for (let i = 0; i < gateOrder.length; i++) {
    const gate = gateOrder[i];
    const row = document.createElement('div');
    row.className = 'gate-row';
    if (state.concourse === 'all' && gate.startsWith('B') && i > 0 && gateOrder[i-1].startsWith('A')) {
      row.style.borderTop = '2px solid var(--accent-soft)';
    }
    row.dataset.gate = gate;
    row.style.position = 'relative';
    
    const gFlights = flightsByGate.get(gate) || [];
    for (const f of gFlights) {
      const bar = makeFlightBar(f);
      row.appendChild(bar);
    }
    
    rowsEl.appendChild(row);
  }
  
  tlCol.appendChild(rowsEl);
  root.appendChild(tlCol);
  
  // Apply current filters/search
  applyFilters();
  updateStats();
  renderLegend();
}

function makeFlightBar(f) {
  const bar = document.createElement('div');
  const meta = AIRLINES[f.airline] || { cls: 'reserved', iata: '??' };
  bar.className = 'flight-bar ' + meta.cls + (f.type !== 'turn' ? ' ron' : '');
  
  const start = Math.max(0, f.bar_start);
  const end = Math.min(CHART_TOTAL_MIN, f.bar_end);
  const width = Math.max(end - start, 6);
  
  bar.style.left = (start * pxPerMin()) + 'px';
  bar.style.width = (width * pxPerMin()) + 'px';
  
  // Stash data
  bar.dataset.airline = f.airline;
  bar.dataset.flightId = f.gate + '-' + (f.dep_flight || f.arr_flight || 'unk') + '-' + start;
  
  // Bar content - line 1: flight numbers; line 2: route
  const arr = f.arr_flight && f.arr_flight !== 'x' && f.arr_flight !== 'X' ? f.arr_flight : null;
  const dep = f.dep_flight && f.dep_flight !== 'x' && f.dep_flight !== 'X' ? f.dep_flight : null;
  
  let line1 = '';
  if (arr && dep && arr !== dep) line1 = arr + ' → ' + dep;
  else if (arr) line1 = arr;
  else if (dep) line1 = dep;
  
  let line2 = '';
  if (f.origin && f.origin !== 'X' && f.dest && f.dest !== 'X') {
    line2 = f.origin + ' → SDF → ' + f.dest;
  } else if (f.origin && f.origin !== 'X') {
    line2 = f.origin + ' → SDF · RON';
  } else if (f.dest && f.dest !== 'X') {
    line2 = 'RON · SDF → ' + f.dest;
  }
  
  let tag = '';
  if (f.type !== 'turn') {
    tag = '<span class="bar-tag">RON</span>';
  } else if (f.aircraft) {
    tag = `<span class="bar-tag">${f.aircraft}</span>`;
  }
  
  // Hide details when bar is too narrow
  const showDetails = (width * pxPerMin()) > 80;
  const showLine2 = (width * pxPerMin()) > 140;
  
  bar.innerHTML = `
    <div class="bar-content">
      ${showDetails ? `<div class="bar-line1">${line1 || '—'}</div>` : ''}
      ${showLine2 ? `<div class="bar-line2">${line2}</div>` : ''}
      ${!showDetails && tag ? tag : ''}
    </div>
  `;
  
  // Search/filter searchable text
  const searchText = [
    f.gate, f.airline, meta.iata, arr, dep, f.aircraft, f.origin, f.dest, f.seats, f.arr_time, f.dep_time
  ].filter(Boolean).join(' ').toLowerCase();
  bar._searchText = searchText;
  bar._flight = f;
  
  // Events
  bar.addEventListener('mouseenter', e => showTooltip(e, f));
  bar.addEventListener('mousemove', e => moveTooltip(e));
  bar.addEventListener('mouseleave', hideTooltip);
  bar.addEventListener('click', e => {
    e.stopPropagation();
    openPanel(f);
  });
  
  return bar;
}

// ============================================================

function showTooltip(e, f) {
  const tt = document.getElementById('tooltip');
  const meta = AIRLINES[f.airline] || {};
  
  const arr = (f.arr_flight && f.arr_flight !== 'x' && f.arr_flight !== 'X') ? f.arr_flight : null;
  const dep = (f.dep_flight && f.dep_flight !== 'x' && f.dep_flight !== 'X') ? f.dep_flight : null;
  
  tt.innerHTML = `
    <div class="tooltip-head" style="border-left: 3px solid ${meta.hex}">
      <div class="tooltip-airline" style="color:${meta.hex}">${f.airline} · ${meta.iata || ''}</div>
      <div class="tooltip-gate">${f.gate}</div>
    </div>
    <div class="tooltip-route">
      <div class="tooltip-airport">
        <div class="code">${f.origin && f.origin !== 'X' ? f.origin : '—'}</div>

      <div class="tooltip-arrow">→</div>

        <div class="code">${f.dest && f.dest !== 'X' ? f.dest : '—'}</div>
        <div class="label">${f.type !== 'turn' && (!f.dest || f.dest === 'X') ? 'RON' : 'To'}</div>
        <div class="time">${f.dep_time || '—'}</div>
      </div>
    </div>
    <div class="tooltip-details">
      <div class="tooltip-detail"><div class="k">Inbound</div><div class="v ${arr ? '' : 'muted'}">${arr || 'Overnight'}</div></div>
      <div class="tooltip-detail"><div class="k">Outbound</div><div class="v ${dep ? '' : 'muted'}">${dep || 'Overnight'}</div></div>
      <div class="tooltip-detail"><div class="k">Aircraft</div><div class="v">${f.aircraft || '—'}</div></div>
      <div class="tooltip-detail"><div class="k">Seats</div><div class="v">${f.seats ? f.seats.replace(' seats', '') : '—'}</div></div>
      <div class="tooltip-detail" style="grid-column: span 2"><div class="k">Turn</div><div class="v">${f.turn || 'N/A'}</div></div>
    </div>
  `;
  
  tt.classList.add('visible');
  moveTooltip(e);
}

function moveTooltip(e) {
  const tt = document.getElementById('tooltip');
  const offset = 16;
  const x = e.clientX + offset;
  const y = e.clientY + offset;
  const rect = tt.getBoundingClientRect();
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  
  let left = x;
  let top = y;
  if (x + rect.width > vw - 8) left = e.clientX - rect.width - offset;
  if (y + rect.height > vh - 8) top = e.clientY - rect.height - offset;
  
  tt.style.left = Math.max(8, left) + 'px';
  tt.style.top = Math.max(8, top) + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').classList.remove('visible');
}

// ============================================================
// Detail Panel
// ============================================================

function openPanel(f) {
  const panel = document.getElementById('panel');
  const overlay = document.getElementById('panel-overlay');
  const body = document.getElementById('panel-body');
  const meta = AIRLINES[f.airline] || {};
  
  const arr = (f.arr_flight && f.arr_flight !== 'x' && f.arr_flight !== 'X') ? f.arr_flight : null;
  const dep = (f.dep_flight && f.dep_flight !== 'x' && f.dep_flight !== 'X') ? f.dep_flight : null;
  
  const originName = AIRPORT_NAMES[f.origin] || '';
  const destName = AIRPORT_NAMES[f.dest] || '';
  
  // Determine route arrows
  let routeViz = '';
  if (f.type === 'turn' && f.origin !== 'X' && f.dest !== 'X') {
    routeViz = `
      <div class="panel-route-line">
        <div class="panel-route-stop">
          <div class="code">${f.origin}</div>
          <div class="label">${originName || 'Inbound'}</div>
          <div class="time">${f.arr_time || ''}</div>
        </div>
        <div class="panel-route-conn">
          <div class="line"></div>
          <div class="turn">${f.turn || 'TURN'}</div>
        </div>
        <div class="panel-route-stop">
          <div class="code">SDF</div>
          <div class="label">Gate ${f.gate}</div>
          <div class="time">${minToDisplayTime(f.bar_start)} – ${minToDisplayTime(f.bar_end)}</div>
        </div>
        <div class="panel-route-conn">
          <div class="line"></div>
        </div>
        <div class="panel-route-stop">
          <div class="code">${f.dest}</div>
          <div class="label">${destName || 'Outbound'}</div>
          <div class="time">${f.dep_time || ''}</div>
        </div>
      </div>
    `;
  } else if (f.type !== 'turn') {
    // RON - single arrival or single departure
    const isDeparting = !!dep && (!arr || arr === 'x');
    const isArriving = !!arr && (!dep || dep === 'x');
    
    if (isDeparting) {
      routeViz = `
        <div class="panel-route-line">
          <div class="panel-route-stop">
            <div class="code">RON</div>
            <div class="label">Overnight</div>
            <div class="time">— prior day —</div>
          </div>
          <div class="panel-route-conn">
            <div class="line"></div>
            <div class="turn">RON · DEPART</div>
          </div>
          <div class="panel-route-stop">
            <div class="code">SDF</div>
            <div class="label">Gate ${f.gate}</div>
            <div class="time">→ ${f.dep_time || ''}</div>
          </div>
          <div class="panel-route-conn">
            <div class="line"></div>
          </div>
          <div class="panel-route-stop">
            <div class="code">${f.dest}</div>
            <div class="label">${destName || 'Outbound'}</div>
            <div class="time">${f.dep_time || ''}</div>
          </div>
        </div>
      `;
    } else {
      routeViz = `
        <div class="panel-route-line">
          <div class="panel-route-stop">
            <div class="code">${f.origin}</div>
            <div class="label">${originName || 'Inbound'}</div>
            <div class="time">${f.arr_time || ''}</div>
          </div>
          <div class="panel-route-conn">
            <div class="line"></div>
            <div class="turn">RON · ARRIVE</div>
          </div>
          <div class="panel-route-stop">
            <div class="code">SDF</div>
            <div class="label">Gate ${f.gate}</div>
            <div class="time">${f.dep_time || 'overnight'}</div>
          </div>
          <div class="panel-route-conn">
            <div class="line"></div>
          </div>
          <div class="panel-route-stop">
            <div class="code">RON</div>
            <div class="label">Overnight</div>
            <div class="time">— next day —</div>
          </div>
        </div>
      `;
    }
  }
  
  body.innerHTML = `
    <div class="panel-airline-banner" style="background: ${meta.hex}22; border-left-color: ${meta.hex}">
      <div class="name" style="color: ${meta.hex}">${f.airline}</div>
      <div class="iata" style="color: ${meta.hex}">${meta.iata} · ${arr || 'overnight'} ${arr && dep && arr !== dep ? '→ ' + dep : ''}</div>
    </div>
    
    <div class="panel-route-viz">
      ${routeViz}
    </div>
    
    <div class="panel-section-title">Flight Details</div>
    <div class="panel-grid">
      <div class="panel-stat"><div class="k">Inbound Flight</div><div class="v">${arr || '—'}</div></div>
      <div class="panel-stat"><div class="k">Outbound Flight</div><div class="v">${dep || '—'}</div></div>
      <div class="panel-stat"><div class="k">Aircraft Type</div><div class="v">${f.aircraft || '—'}</div></div>
      <div class="panel-stat"><div class="k">Seats</div><div class="v">${f.seats ? f.seats.replace(' seats', '') : '—'}</div></div>
      <div class="panel-stat"><div class="k">Arr Time</div><div class="v">${f.arr_time || 'overnight'}</div></div>
      <div class="panel-stat"><div class="k">Dep Time</div><div class="v">${f.dep_time || 'overnight'}</div></div>
      <div class="panel-stat"><div class="k">Turn / Block</div><div class="v">${f.turn || '—'}</div></div>
      <div class="panel-stat"><div class="k">Concourse</div><div class="v">${f._concourse ? f._concourse.toUpperCase() : f.gate.charAt(0)}</div></div>
    </div>
    
    <div class="panel-section-title">Notes</div>
    <div class="panel-stat" style="background:transparent;border:1px dashed var(--border-strong);">
      <div class="v" style="font-family: 'Space Grotesk', sans-serif; font-size: 12px; color: var(--text-dim); font-weight: 400;">
        ${f.type === 'ron_in' ? 'Aircraft arrived previous day for overnight stay before departing this operating day.' : ''}
        ${f.type === 'ron_out' ? 'Aircraft will remain overnight at SDF after this arrival.' : ''}
        ${f.type === 'turn' ? `Standard turn at Gate ${f.gate}. Coordinate ground handling for ${f.aircraft || 'aircraft'} on time.` : ''}
      </div>
    </div>
  `;
  
  panel.classList.add('visible');
  overlay.classList.add('visible');
}

function closePanel() {
  document.getElementById('panel').classList.remove('visible');
  document.getElementById('panel-overlay').classList.remove('visible');
}

// ============================================================
// Filters
// ============================================================

function applyFilters() {
  const bars = document.querySelectorAll('.flight-bar');
  const nowMin = getNowMin();
  const search = state.search.trim().toLowerCase();
  
  let activeCount = 0;
  let visibleCount = 0;
  
  bars.forEach(bar => {
    const f = bar._flight;
    const meta = AIRLINES[f.airline] || {};
    
    let visible = true;
    
    // Airline filter
    if (state.airlinesOff.has(f.airline)) visible = false;
    
    // Filter mode
    if (state.filter === 'active') {
      if (!(f.bar_start <= nowMin && f.bar_end >= nowMin)) visible = false;
    } else if (state.filter === 'ron') {
      if (f.type === 'turn') visible = false;
    } else if (state.filter === 'turns') {
      if (f.type !== 'turn') visible = false;
    }
    
    // Search
    if (search && !bar._searchText.includes(search)) visible = false;
    
    bar.classList.toggle('dimmed', !visible);
    bar.style.pointerEvents = visible ? 'auto' : 'none';
    if (visible) visibleCount++;
    
    if (f.bar_start <= nowMin && f.bar_end >= nowMin) activeCount++;
  });
  
  document.getElementById('active-count').textContent = activeCount;
}

function updateStats() {
  const flights = getFlights();
  document.getElementById('total-count').textContent = flights.length;
  document.getElementById('count-a').textContent = FLIGHT_DATA.concourse_a.length;
  document.getElementById('count-b').textContent = FLIGHT_DATA.concourse_b.length;
  document.getElementById('count-all').textContent = FLIGHT_DATA.concourse_a.length + FLIGHT_DATA.concourse_b.length;
}

function updateNowDisplay() {
  const realNow = new Date();
  const h = realNow.getHours();
  const m = realNow.getMinutes();
  const baseH = 4, baseM = 30;
  let curMin = h * 60 + m - (baseH * 60 + baseM);
  const inOpsWindow = curMin >= -60 && curMin <= CHART_END_MIN + 60;
  const display = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  document.getElementById('now-display').textContent = inOpsWindow ? display : display + ' (off-ops)';
}

function renderLegend() {
  const legend = document.getElementById('legend');
  // Preserve label
  const flights = getFlights();
  const counts = {};
  for (const f of flights) {
    counts[f.airline] = (counts[f.airline] || 0) + 1;
  }
  
  // Find the label
  legend.innerHTML = '<span class="legend-label">Airlines</span>';
  
  const presentAirlines = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  for (const a of presentAirlines) {
    const meta = AIRLINES[a];
    if (!meta) continue;
    const item = document.createElement('div');
    item.className = 'legend-item' + (state.airlinesOff.has(a) ? ' disabled' : '');
    item.innerHTML = `
      <div class="legend-swatch ${meta.cls}"></div>
      <span class="legend-name">${meta.iata}</span>
      <span class="legend-count">${counts[a]}</span>
    `;
    item.addEventListener('click', () => {
      if (state.airlinesOff.has(a)) state.airlinesOff.delete(a);
      else state.airlinesOff.add(a);
      applyFilters();
      renderLegend();
    });
    legend.appendChild(item);
  }
  
  // RON marker
  const ron = document.createElement('div');
  ron.className = 'legend-item';
  ron.style.cursor = 'default';
  ron.innerHTML = `<div class="legend-swatch ron"></div><span class="legend-name">RON / Overnight</span>`;
  legend.appendChild(ron);
}

// ============================================================
// Event handlers
// ============================================================

function setupHandlers() {
  // Concourse tabs
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      state.concourse = t.dataset.concourse;
      render();
    });
  });
  
  // Zoom buttons
  document.querySelectorAll('[data-zoom]').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('[data-zoom]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      state.zoom = parseFloat(b.dataset.zoom);
      render();
    });
  });
  
  // Filter mode buttons
  const filterBtns = {
    'show-all': 'all',
    'show-active': 'active',
    'show-ron': 'ron',
    'show-turns': 'turns',
  };
  Object.keys(filterBtns).forEach(id => {
    document.getElementById(id).addEventListener('click', () => {
      Object.keys(filterBtns).forEach(x => document.getElementById(x).classList.remove('active'));
      document.getElementById(id).classList.add('active');
      state.filter = filterBtns[id];
      applyFilters();
    });
  });
  
  // Search
  document.getElementById('search').addEventListener('input', e => {
    state.search = e.target.value;
    applyFilters();
  });
  
  // Jump buttons
  function scrollToMin(m, center = true) {
    const wrap = document.getElementById('gantt-wrap');
    const target = m * pxPerMin() + 240;  // +240 for gate column width
    if (center) {
      wrap.scrollLeft = Math.max(0, target - wrap.clientWidth / 2);
    } else {
      wrap.scrollLeft = Math.max(0, target);
    }
  }
  document.getElementById('jump-now').addEventListener('click', () => scrollToMin(getNowMin()));
  document.getElementById('jump-am').addEventListener('click', () => scrollToMin(330));   // 10:00
  document.getElementById('jump-pm').addEventListener('click', () => scrollToMin(630));   // 15:00
  document.getElementById('jump-eve').addEventListener('click', () => scrollToMin(930));  // 20:00
  
  // Panel close
  document.getElementById('panel-close').addEventListener('click', closePanel);
  document.getElementById('panel-overlay').addEventListener('click', closePanel);
  
  // ESC closes panel
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closePanel();
      hideTooltip();
    }
  });
  
  // Ticking clock
  setInterval(() => {
    updateNowDisplay();
    // Update now line position
    const nowEl = document.querySelector('.now-line');
    if (nowEl) {
      const nowMin = getNowMin();
      nowEl.style.left = (nowMin * pxPerMin()) + 'px';
      const lbl = nowEl.querySelector('.now-label');
      if (lbl) lbl.textContent = 'NOW · ' + minToHHMM(nowMin);
    }
    if (state.filter === 'active') applyFilters();
  }, 30000); // every 30s
}

// ============================================================
// Init
// ============================================================

setupHandlers();
render();
updateNowDisplay();

// Auto-scroll on initial load: prefer real "now" if it's during the operating day,
// otherwise default to the morning push (~08:00) which is when the chart is most useful for planning.
setTimeout(() => {
  const wrap = document.getElementById('gantt-wrap');
  const realNow = getNowMin();
  // 06:00 = 90 min, 23:00 = 1110 min — anywhere in this window, use real now
  const inOpsHours = realNow >= 90 && realNow <= 1110;
  const target = (inOpsHours ? realNow : 210) * pxPerMin() + 240; // 210 = 08:00
  wrap.scrollLeft = Math.max(0, target - wrap.clientWidth / 3);
}, 100);

</script>
